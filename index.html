<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>people playground.</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        font-family: Tahoma, sans-serif;
      }

      #unity-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        width: 100vw !important;
        height: 100vh !important;
        display: block;
        background: #000;
      }

      /* Loader Overlay */
      #xp-loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 340px;
        background: #ece9d8;
        border: 2px solid #3a6ea5;
        box-shadow: 0 0 0 3px #ffffff inset;
        color: #000;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 9999;
      }

      #xp-loader-title {
        background: linear-gradient(#2b74c7, #1a4a9c);
        color: white;
        padding: 4px 8px;
        font-size: 14px;
        font-weight: bold;
      }

      #xp-loader-status {
        font-size: 12px;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #xp-loader-bar {
        width: 100%;
        height: 18px;
        border: 1px solid #3a6ea5;
        background: white;
        overflow: hidden;
      }

      #xp-loader-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(to bottom, #74b0f7, #3b7ad0);
        transition: width 0.1s ease;
      }

      #xp-loader-text {
        font-size: 12px;
        text-align: right;
        color: #333;
      }

      /* Standard Unity Loader Template Compatibility Elements */
      #unity-loading-bar {
        display: none;
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.2);
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #2b74c7;
      }

      /* Hidden Error Console */
      #error-console {
        display: none;
        position: fixed;
        bottom: 10px;
        left: 10px;
        right: 10px;
        max-height: 35vh;
        background: rgba(20, 0, 0, 0.92);
        border: 2px solid #ff3333;
        color: #ff9999;
        font-family: monospace;
        font-size: 11px;
        padding: 10px;
        overflow-y: auto;
        z-index: 100000;
      }

      #error-console h4 {
        margin: 0 0 6px 0;
        color: #ff4d4d;
        font-size: 12px;
        border-bottom: 1px solid #ff3333;
        padding-bottom: 4px;
        display: flex;
        justify-content: space-between;
      }

      .error-entry {
        margin-bottom: 4px;
        white-space: pre-wrap;
        word-break: break-word;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
        padding-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <!-- XP Unity Loader Box -->
    <div id="xp-loader">
      <div id="xp-loader-title">People Playground Loader</div>
      <div id="xp-loader-status">Waiting for file merger...</div>
      <div id="xp-loader-bar"><div id="xp-loader-fill"></div></div>
      <div id="xp-loader-text">0%</div>
    </div>

    <!-- Standard Unity Loading Bar Elements (For External API Detection) -->
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <!-- Unity Container -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <!-- Hidden Error Log Overlay -->
    <div id="error-console">
      <h4>
        <span>⚠️ Execution Error</span>
        <span id="clear-log-btn" style="cursor:pointer; text-decoration:underline;" onclick="document.getElementById('error-log-list').innerHTML='';">Clear</span>
      </h4>
      <div id="error-log-list"></div>
    </div>

    <!-- FileMerger Configuration -->
    <script>
      window.fileMergerConfig = {
        files: [
          { name: 'pggbog.data', parts: 7 },
          { name: 'pggbog.wasm', parts: 3 }
        ],
        basePath: 'Build/',
        debug: true
      };  
    </script>
    <script src="./merge.js"></script>

    <script>
      window.gameLoaded = false;

      // 1. Error Logger with Filter & Game-Loaded Auto-Suppress
      (function setupErrorLogging() {
        var errorConsole = document.querySelector("#error-console");
        var errorLogList = document.querySelector("#error-log-list");

        var ignoredPhrases = [
          "icall:",
          "Win32Exception",
          "SUSPICIOUS BEHAVIOUR",
          "stat failure",
          "shader",
          "GetProcesses_internal",
          "ShellExecuteEx_internal"
        ];

        function isIgnored(msg) {
          for (var i = 0; i < ignoredPhrases.length; i++) {
            if (msg.indexOf(ignoredPhrases[i]) !== -1) return true;
          }
          return false;
        }

        function displayError(msg) {
          // Suppress error overlay completely once the game loads or if message is harmless
          if (window.gameLoaded || isIgnored(msg)) return;

          errorConsole.style.display = "block";
          var entry = document.createElement("div");
          entry.className = "error-entry";
          entry.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
          errorLogList.appendChild(entry);
          errorConsole.scrollTop = errorConsole.scrollHeight;
        }

        var originalConsoleError = console.error;
        console.error = function () {
          originalConsoleError.apply(console, arguments);
          var args = Array.prototype.slice.call(arguments);
          var formatted = args.map(function(a) {
            return (typeof a === 'object') ? JSON.stringify(a, null, 2) : a;
          }).join(" ");
          displayError(formatted);
        };

        window.addEventListener("error", function (event) {
          displayError("Uncaught Exception: " + event.message + " (" + event.filename + ":" + event.lineno + ")");
        });

        window.addEventListener("unhandledrejection", function (event) {
          displayError("Unhandled Promise Rejection: " + (event.reason.stack || event.reason));
        });
      })();

      // 2. Unity Engine Loader
      (function launchUnity() {
        var canvas = document.querySelector("#unity-canvas");
        var xpBox = document.querySelector("#xp-loader");
        var xpFill = document.querySelector("#xp-loader-fill");
        var xpText = document.querySelector("#xp-loader-text");
        var xpStatus = document.querySelector("#xp-loader-status");
        var errorConsole = document.querySelector("#error-console");
        var standardProgressBar = document.querySelector("#unity-progress-bar-full");

        function unityShowBanner(msg, type) {
          console.error("Unity [" + type + "]: " + msg);
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/pggbog.loader.js";
        var config = {
          dataUrl: buildUrl + "/pggbog.data",
          frameworkUrl: buildUrl + "/pggbog.framework.js",
          codeUrl: buildUrl + "/pggbog.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Studio Minus",
          productName: "People Playground",
          productVersion: "1",
          showBanner: unityShowBanner,
          matchWebGLToCanvasSize: true
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
        }

        xpStatus.textContent = "Loading loader script...";

        var script = document.createElement("script");
        script.src = loaderUrl;
        
        script.onload = function() {
          xpStatus.textContent = "Initializing Unity Engine...";

          if (typeof createUnityInstance !== "function") {
            console.error("createUnityInstance is not defined! pggbog.loader.js failed to load.");
            return;
          }

          createUnityInstance(canvas, config, function(progress) {
            var p = Math.round(progress * 100);
            
            // Update local XP Loader
            xpFill.style.width = p + "%";
            xpText.textContent = p + "%";
            
            // Update Standard Unity API Progress Elements
            if (standardProgressBar) {
              standardProgressBar.style.width = p + "%";
            }

            // Broadcast Unity API Progress
            window.unityProgress = progress;
            window.dispatchEvent(new CustomEvent("unityProgress", { detail: progress }));
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: "unityProgress", progress: progress }, "*");
            }

            if (p < 90) {
              xpStatus.textContent = "Unpacking Assets: " + p + "%";
            } else {
              xpStatus.textContent = "Compiling WebAssembly Engine: " + p + "%";
            }
          }).then(function(unityInstance) {
            window.unityInstance = unityInstance;
            window.gameLoaded = true; // Mark game as loaded
            xpBox.style.display = "none";
            errorConsole.style.display = "none"; // Hide error log completely
            canvas.focus();
            console.log("Unity Engine successfully booted!");
          }).catch(function(message) {
            console.error("Unity Instance Error: " + message);
          });
        };

        script.onerror = function() {
          console.error("Failed to load script: " + loaderUrl);
        };

        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
